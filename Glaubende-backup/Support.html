      <!DOCTYPE html>
      <html lang="de">
      <head>
        <meta charset="UTF-8" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <style>
          body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
          }

          h1, h2 {
            color: #f0c000;
          }

          .block {
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
          }

          .zeit {
            color: #888;
            font-size: 0.9em;
          }

          .gebet {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
          }

          .logo {
            font-size: 2em;
            color: #f0c000;
            text-align: center;
            margin-bottom: 10px;
          }

          .footer {
            text-align: center;
            color: #555;
            font-size: 0.8em;
            margin-top: 40px;
            padding-top: 10px;
            border-top: 1px solid #333;
          }

          /* Menü-Stile */
          .menu-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            color: #f0c000;
            cursor: pointer;
            z-index: 1001;
          }

          .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            right: 0;
            background-color: #1e1e1e;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            z-index: 1000;
          }

          .sidebar a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: 1.1em;
            color: #f0c000;
            display: block;
            transition: 0.2s;
          }

          .sidebar a:hover {
            background-color: #333;
          }

          .sidebar .closebtn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 1.5em;
          }

          html {
            scroll-behavior: smooth;
          }
        </style>
      </head>

        <script>
          // Verhindert das Verlassen des Vollbildmodus im Web-App-Modus
          if (window.navigator.standalone) {
            document.querySelectorAll('a').forEach(function(link) {
              const href = link.getAttribute('href');
              if (href && !href.startsWith('http') && !href.startsWith('mailto:') && !href.startsWith('tel:')) {
                link.addEventListener('click', function(e) {
                  e.preventDefault();
                  window.location = href;
                });
              }
            });
          }
        </script>

        <body>

        <!-- Menü-Icon -->
        <div id="menuToggle" class="menu-toggle" onclick="openMenu()">
          <i class="fas fa-bars"></i>
        </div>

        <!-- Seitenmenü -->
        <div id="sidebar" class="sidebar">

          <!-- Support-Formular -->
          <div class="support-formular" style="max-width: 400px; margin: 40px auto; padding: 20px; background-color: #121212; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.6); text-align: center; font-family: Arial, sans-serif;">
            <form action="https://formspree.io/f/myzygrlq" method="POST" autocomplete="off">
              <div style="font-size: 28px; color: #ffd700; margin-bottom: 10px;">✝</div>
              <h3 style="color: #66ccff; font-size: 18px; margin-bottom: 15px;">Schreib mir – der Herr segne dich</h3>

              <div style="display: flex; flex-direction: column; align-items: center;">
                <input type="text" name="name" placeholder="Dein Name" required
                  style="width: 100%; max-width: 320px; padding: 10px; margin-bottom: 12px; border: none; border-radius: 6px; background-color: #1e1e1e; color: #ffffff; font-size: 15px;" />

                <input type="email" name="email" placeholder="Deine E-Mail" required
                  style="width: 100%; max-width: 320px; padding: 10px; margin-bottom: 12px; border: none; border-radius: 6px; background-color: #1e1e1e; color: #ffffff; font-size: 15px;" />

                <textarea name="message" placeholder="Deine Nachricht" required
                  style="width: 100%; max-width: 320px; padding: 10px; height: 100px; margin-bottom: 12px; border: none; border-radius: 6px; background-color: #1e1e1e; color: #ffffff; font-size: 15px; resize: none;"></textarea>

                <button type="submit"
                  style="width: 100%; max-width: 320px; padding: 10px; background: linear-gradient(135deg, #66ccff, #3399cc); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">Absenden</button>
              </div>

              <p style="margin-top: 10px; font-size: 12px; color: #cccccc; font-style: italic;">„Der Herr ist nahe allen, die ihn anrufen.“ – Psalm 145,18</p>
            </form>
          </div>

          <div class="footer">
            © <span id="year"></span> – Dein täglicher Gebetsplan
          </div>

          <script>
            document.getElementById("year").textContent = new Date().getFullYear();
          </script>

        <script>
          function openMenu() {
            document.getElementById("sidebar").style.width = "250px";
            document.getElementById("menuToggle").style.display = "none";
          }

          function closeMenu() {
            document.getElementById("sidebar").style.width = "0";
            document.getElementById("menuToggle").style.display = "block";
          }
        </script>

      </body>
